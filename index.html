<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Learn Hungarian — live speech translation and practice" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f9f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090c0a" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Learn Hungarian" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/brand-mark.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Learn Hungarian</title>
    <script>
      (function () {
        var theme = localStorage.getItem('learn-hungarian-theme');
        document.documentElement.dataset.theme =
          theme === 'light' || theme === 'dark' || theme === 'system' ? theme : 'system';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

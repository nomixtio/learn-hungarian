name: Preview

# Ephemeral per-branch environments, each with its own isolated D1.
#   PR opened / synchronized -> deploy `pr-<n>` (URL posted on the PR by alchemy.run.ts)
#   PR closed               -> destroy `pr-<n>`
#   push to any other branch (no PR needed) -> deploy `br-<slug>`
#   branch deleted          -> destroy `br-<slug>`
#
# Previews never run cron triggers and never touch staging/production data.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches-ignore: [master, staging]
  delete: {}

concurrency:
  group: preview-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.compute.outputs.stage }}
    steps:
      - id: compute
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "stage=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "delete" ]; then
            slug=$(echo "${{ github.event.ref }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-48)
            echo "stage=br-${slug}" >> "$GITHUB_OUTPUT"
          else
            slug=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-48)
            echo "stage=br-${slug}" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: stage
    if: github.event_name != 'delete' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      STAGE: ${{ needs.stage.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check required secrets
        run: |
          missing=""
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "${{ secrets.ALCHEMY_PASSWORD }}" ] && missing="$missing ALCHEMY_PASSWORD"
          [ -z "${{ secrets.SONIOX_API_KEY }}" ] && missing="$missing SONIOX_API_KEY"
          [ -z "${{ secrets.VAPID_PRIVATE_KEY }}" ] && missing="$missing VAPID_PRIVATE_KEY"
          [ -z "${{ secrets.VAPID_PUBLIC_KEY }}" ] && missing="$missing VAPID_PUBLIC_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing — add them under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi

      - name: Check provider env
        run: npx alchemy provider check-env --provider Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # wrangler.jsonc is gitignored; the example provides local bindings for vite build.
      - name: Bootstrap wrangler config
        run: cp wrangler.jsonc.example wrangler.jsonc

      - name: Build
        run: npm run build

      - name: Deploy preview
        run: npx alchemy deploy --stage "$STAGE" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          SONIOX_API_KEY: ${{ secrets.SONIOX_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          SONIOX_REGION: ${{ vars.SONIOX_REGION }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    needs: stage
    if: github.event.action == 'closed' || github.event_name == 'delete'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      STAGE: ${{ needs.stage.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check required secrets
        run: |
          missing=""
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "${{ secrets.ALCHEMY_PASSWORD }}" ] && missing="$missing ALCHEMY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing — add them under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi

      - name: Safety check
        run: |
          case "$STAGE" in
            production|staging|live_*|dev_*|test_*)
              echo "ERROR: refusing to destroy protected stage '$STAGE'"
              exit 1
              ;;
          esac

      - name: Destroy preview environment
        run: npx alchemy destroy --stage "$STAGE" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

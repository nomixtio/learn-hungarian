name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # wrangler.jsonc is gitignored; the example provides local bindings (D1 + vars).
      - run: cp wrangler.jsonc.example wrangler.jsonc

      # Typechecks (app, worker, worker tests) + production build.
      - run: npm run build

      # Unit + component tests with coverage gates (see vitest.config.ts).
      - run: npm run test:coverage

      # Worker integration tests (workerd + isolated local D1).
      - run: npm run test:worker

      - run: npx playwright install --with-deps chromium

      # Fresh checkouts have an empty local D1 — migrate it before E2E.
      - run: npm run test:e2e:setup

      # End-to-end tests (vite dev + real worker API, mocked Soniox).
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Long-lived staging environment. Runs only on the `staging` branch,
  # and only after the test job above succeeds.
  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check required secrets
        run: |
          missing=""
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "${{ secrets.ALCHEMY_PASSWORD }}" ] && missing="$missing ALCHEMY_PASSWORD"
          [ -z "${{ secrets.SONIOX_API_KEY }}" ] && missing="$missing SONIOX_API_KEY"
          [ -z "${{ secrets.VAPID_PRIVATE_KEY }}" ] && missing="$missing VAPID_PRIVATE_KEY"
          [ -z "${{ secrets.VAPID_PUBLIC_KEY }}" ] && missing="$missing VAPID_PUBLIC_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing — add them under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi

      - name: Check provider env
        run: npx alchemy provider check-env --provider Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # wrangler.jsonc is gitignored; the example provides local bindings for vite build.
      - run: cp wrangler.jsonc.example wrangler.jsonc

      - run: npm run build

      - name: Deploy to staging
        run: npx alchemy deploy --stage staging --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          SONIOX_API_KEY: ${{ secrets.SONIOX_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          SONIOX_REGION: ${{ vars.SONIOX_REGION }}

  # Ephemeral per-branch environments (share the staging D1, no cron).
  # Runs only after the test job above succeeds. Destroyed on PR
  # close / branch delete by preview.yml, plus a post-deploy self-clean
  # below in case the PR closed (or the branch vanished) while the
  # deploy was still running.
  deploy-preview:
    needs: test
    # Dependabot PRs get no repo secrets (GitHub restriction), so previews
    # can't deploy there — tests still gate. Previews stay for human branches.
    if: ((github.event_name == 'pull_request' && github.event.action != 'closed') || (github.event_name == 'push' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/staging')) && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check required secrets
        run: |
          missing=""
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "${{ secrets.ALCHEMY_PASSWORD }}" ] && missing="$missing ALCHEMY_PASSWORD"
          [ -z "${{ secrets.SONIOX_API_KEY }}" ] && missing="$missing SONIOX_API_KEY"
          [ -z "${{ secrets.VAPID_PRIVATE_KEY }}" ] && missing="$missing VAPID_PRIVATE_KEY"
          [ -z "${{ secrets.VAPID_PUBLIC_KEY }}" ] && missing="$missing VAPID_PUBLIC_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing — add them under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi

      - name: Check provider env
        run: npx alchemy provider check-env --provider Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # wrangler.jsonc is gitignored; the example provides local bindings for vite build.
      - run: cp wrangler.jsonc.example wrangler.jsonc

      - run: npm run build

      - name: Compute stage
        id: stage
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            slug=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-48)
            echo "name=br-${slug}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy preview
        run: npx alchemy deploy --stage "${{ steps.stage.outputs.name }}" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          SONIOX_API_KEY: ${{ secrets.SONIOX_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          SONIOX_REGION: ${{ vars.SONIOX_REGION }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Race guard: preview.yml's destroy may have run while this deploy was
      # still in flight (PR merged/closed mid-deploy), leaving an orphaned
      # Worker behind. If the PR is already closed — or the branch is gone /
      # has no open PR left — destroy the stage we just deployed.
      # Skipped for master/staging (this job never previews those refs).
      - name: Destroy preview if already obsolete
        if: always()
        run: |
          STAGE="${{ steps.stage.outputs.name }}"
          if [ -z "$STAGE" ]; then
            echo "ERROR: empty stage name, refusing to destroy"
            exit 1
          fi
          case "$STAGE" in
            production|staging|live_*|dev_*|test_*)
              echo "ERROR: refusing to destroy protected stage '$STAGE'"
              exit 1
              ;;
          esac
          SHOULD_DESTROY=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR="${{ github.event.pull_request.number }}"
            STATE=$(gh pr view "$PR" --json state -q .state --repo "${{ github.repository }}")
            echo "PR #$PR state: $STATE"
            case "$STATE" in
              MERGED|CLOSED) SHOULD_DESTROY="PR #$PR is $STATE" ;;
            esac
          else
            BRANCH="${{ github.ref_name }}"
            if ! gh api "repos/${{ github.repository }}/branches/$BRANCH" --silent 2>/dev/null; then
              SHOULD_DESTROY="branch '$BRANCH' no longer exists"
            else
              OPEN_COUNT=$(gh pr list --head "$BRANCH" --state open --json number -q length --repo "${{ github.repository }}")
              CLOSED_COUNT=$(gh pr list --head "$BRANCH" --state closed --json number -q length --repo "${{ github.repository }}")
              echo "Branch '$BRANCH': $OPEN_COUNT open / $CLOSED_COUNT closed PRs"
              if [ "$OPEN_COUNT" = "0" ] && [ "$CLOSED_COUNT" != "0" ]; then
                SHOULD_DESTROY="branch '$BRANCH' has no open PR left"
              fi
            fi
          fi
          if [ -z "$SHOULD_DESTROY" ]; then
            echo "Preview still wanted — keeping stage $STAGE."
            exit 0
          fi
          echo "--- Destroying stage $STAGE ($SHOULD_DESTROY) ---"
          npx alchemy destroy --stage "$STAGE" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          SONIOX_API_KEY: ${{ secrets.SONIOX_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          SONIOX_REGION: ${{ vars.SONIOX_REGION }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
